<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regnum — Podgląd Elitarnych Potworów (1★ / 2★)</title>
  <style>
    :root {
      --bg: #111316;
      --card: #1a1e23;
      --border: #2c333c;
      --text: #e8ecf1;
      --muted: #9aa5b1;
      --gold: #f0c05a;
      --cyan: #67d8ff;
      --green: #69db7c;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 28px 20px 18px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #171b21 0%, #111316 100%);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      letter-spacing: 0.3px;
      color: var(--gold);
    }
    header p {
      margin: 0 auto 16px;
      max-width: 720px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .filter-btn {
      background: #232830;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { border-color: var(--gold); }
    .filter-btn.active {
      background: var(--gold);
      color: #14161a;
      border-color: var(--gold);
      font-weight: 700;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 56px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.32);
    }
    .card.hidden { display: none; }
    .card-head {
      padding: 16px 20px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .card-title-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .card-title { margin: 0; font-size: 1.18rem; }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge-new { background: rgba(103, 216, 255, 0.16); color: var(--cyan); border: 1px solid rgba(103, 216, 255, 0.4); }
    .badge-live { background: rgba(105, 219, 124, 0.16); color: var(--green); border: 1px solid rgba(105, 219, 124, 0.4); }
    .badge-alt { background: rgba(192, 132, 252, 0.16); color: var(--purple); border: 1px solid rgba(192, 132, 252, 0.4); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: #27303b;
      color: var(--text);
      border: 1px solid #394452;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.84rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #323e4d; border-color: var(--gold); }
    .btn.copied { background: #265936; border-color: var(--green); color: #fff; }
    .card-desc {
      padding: 10px 20px 0;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .gif-wrap {
      padding: 16px 20px 20px;
      text-align: center;
    }
    .gif-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #2b3138;
      image-rendering: pixelated;
      cursor: zoom-in;
      background: #2a2e2c;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 96vw;
      max-height: 94vh;
      border-radius: 10px;
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    footer {
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

    <p>Wszystkie animowane podglądy (0★ oryginał | 1★ | 2★, kierunki S/E/W/N 3× + podgląd 1× w ciemnej jaskini). Kliknij dowolny GIF, aby powiększyć.</p>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Wszystkie (23)</button>
      <button class="filter-btn" data-filter="new3">Nowe Elity (2)</button>
      <button class="filter-btn" data-filter="drow">Rodzina Drow (3)</button>

      <button class="filter-btn" data-filter="elf">Inne Style Elfa (2)</button>
      <button class="filter-btn" data-filter="alt">Warianty &amp; Archiwum (10)</button>
    </div>
  </header>

  <main id="gallery"></main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="Powiększony podgląd" />
  </div>

        title: "Cave Rat #56 — v2 Quartz-Spined / Amethyst Geode",

        desc: "Kreatywny wariant v2 Cave Rata: 1★ Quartz-Spined (kryształy kwarcu) • 2★ Amethyst Geode (ametystowa geoda z koroną kryształów)."
      }
    ];

    const gallery = document.getElementById("gallery");
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightbox-img");

    function render() {
      gallery.innerHTML = "";
      items.forEach((it) => {
        const gifRel = "gifs/" + it.file;
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.cat = it.cat;
        card.innerHTML = `
          <div class="card-head">
            <div class="card-title-wrap">
              <h2 class="card-title">${it.title}</h2>
              <span class="badge ${it.badge[1]}">${it.badge[0]}</span>
            </div>
            <div class="actions">
              <button class="btn copy-btn" data-url="${gifRel}">Kopiuj link GIF</button>
              <a class="btn" href="${gifRel}" download="${it.file}">Pobierz</a>
            </div>
          </div>
          <p class="card-desc">${it.desc}</p>
          <div class="gif-wrap">
            <img src="${gifRel}" alt="${it.title}" loading="lazy" />
          </div>
        `;
        card.querySelector("img").addEventListener("click", () => {
          lbImg.src = gifRel;
          lb.classList.add("open");
        });
        card.querySelector(".copy-btn").addEventListener("click", async (e) => {
          const fullUrl = new URL(gifRel, window.location.href).href;
          try {
            await navigator.clipboard.writeText(fullUrl);
            const b = e.currentTarget;
            const old = b.textContent;
            b.textContent = "Skopiowano!";
            b.classList.add("copied");
            setTimeout(() => { b.textContent = old; b.classList.remove("copied"); }, 1600);
          } catch {
            prompt("Skopiuj link:", fullUrl);
          }
        });
        gallery.appendChild(card);
      });
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const f = btn.dataset.filter;
        document.querySelectorAll(".card").forEach((c) => {
          c.classList.toggle("hidden", f !== "all" && c.dataset.cat !== f);
        });
      });
    });

    lb.addEventListener("click", () => lb.classList.remove("open"));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") lb.classList.remove("open"); });

    render();
  </script>
</body>
</html>
